name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    container: ros:jazzy
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies, build and test
        shell: bash
        run: ./setup.sh --test
