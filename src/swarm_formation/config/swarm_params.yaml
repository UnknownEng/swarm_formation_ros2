/**:
  ros__parameters:
    # Swarm Geometry and General Configuration
    total_robots: 5
    formation_radius: 2.0
    control_rate: 50.0

    # Kinematic Limits
    max_linear_vel: 1.4
    max_angular_vel: 3.0

    # Relative Neighbor & Obstacle Sensing (M1)
    sensing_range: 6.0
    range_noise_std: 0.0
    bearing_noise_std: 0.0
    sensor_rate: 20.0

    # Standalone Network Impairment Channel (M2)
    default_drop_rate: 0.0
    default_delay_sec: 0.0
    default_jitter_sec: 0.0
    network_rate: 50.0

    # Consensus Gains
    linear_gain_kp: 1.8
    damping_gain_kd: 0.5
    yaw_gain_kyaw: 4.0

    # Formation anchor (virtual leader; uses the EKF world-position estimate). Displacement
    # consensus only fixes relative positions, so without it the formation drifts (1-2.6 m
    # in 40 s) and gets pressed against the arena wall. Anchored at the spawn centroid
    # with navigation on: kinematic sim 6/6 runs converge (centroid within 0.15 m), Gazebo
    # converged at 13 s with 0.10 m final error once wheel odometry reached the EKF.
    # (Earlier anchored Gazebo failures were caused by the missing odometry.)
    anchor_gain: 0.4
    # Anchor gain while a robot hears no neighbour (receiver failure fallback)
    isolated_anchor_gain: 1.8
    formation_center_x: 0.44
    formation_center_y: -0.44

    # Navigation layer (A* on the known map, obstacles inflated by the CBF clearance).
    # Overrides formation control only while the straight line to the target is blocked.
    use_navigation: true
    # Obstacle clearance for the planner; -1 = derive from the CBF settings
    # (safety_dist_obs + cbf_lookahead + max_linear_vel * delay_bound_sec + 0.05),
    # so routes never lead into gaps the CBF refuses to pass (0.57 m at defaults).
    nav_inflation: -1.0
    nav_carrot_dist: 0.6
    nav_replan_period: 0.5
    nav_min_force: 0.4

    # Force -> (v, w) mapping. 'calm' scales the turn rate with the force size and stops
    # below stop_force until the force exceeds resume_force. Gazebo, settled phase:
    # legacy mapper spun at up to 3 rad/s; band 0.15/0.30 still 1.71 rad/s (residual
    # forces of a ~7 cm formation error exceed 0.30); band 0.5/0.9 -> 0.00 rad/s and
    # 0.000 m/s with the shape error 0.068 -> 0.060 m. Robots stop at ~6 cm formation error.
    twist_mapper: calm
    turn_full_force: 1.0
    stop_force: 0.5
    resume_force: 0.9

    # Delay compensation: subtract the robot's own motion since each delayed measurement.
    # Kinematic sim, launch fault settings (80 +/- 40 ms): final error 0.09-0.12 -> 0.07-0.10 m,
    # settled turning 0.77 -> 0.34 rad/s; 200 ms delay: 1/4 -> 3/4 runs converge. Also
    # extrapolating the neighbour (peer_velocity_gain > 0) made it worse (noisy velocity).
    delay_compensation: true
    peer_velocity_gain: 0.0

    # Huber Loss & Robust Consensus
    huber_delta: 2.0
    ema_alpha: 0.35
    heartbeat_timeout: 1.2

    # Layer 1: Peer-to-Peer APF Safety Barrier
    apf_collision_dist: 0.50
    apf_safe_dist: 1.10
    apf_influence_dist: 1.80
    apf_repulsion_gain: 1.2
    apf_barrier_gain: 2.0
    apf_damping_gain: 1.5
    apf_lateral_ratio: 0.6

    # Layer 2: Environmental Obstacle APF Barrier
    obs_influence_dist: 0.45
    obs_safe_dist: 0.30
    obs_repulsion_gain: 0.6
    obs_barrier_gain: 0.8
    obs_damping_gain: 0.8
    obs_tangent_ratio: 1.0

    # Control Barrier Function (CBF-QP) Safety Layer (M6)
    use_safety_filter: true
    safety_dist_peer: 0.55
    safety_dist_obs: 0.30
    cbf_gamma_peer: 1.5
    cbf_gamma_obs: 2.0
    delay_bound_sec: 0.05
    cbf_lookahead: 0.15
    # Share of each robot-robot barrier a robot enforces (0.5 reciprocal; see cbf_qp)
    peer_responsibility: 0.5
    filter_rate: 50.0

    # Fault Injection Parameters
    fault_packet_loss_rate: 0.15
    fault_noise_std: 0.18
    fault_delay_min: 0.05
    fault_delay_max: 0.15
    fault_dropout_robot_id: 4
    fault_dropout_start_sec: 5.0
    fault_dropout_end_sec: 10.0
